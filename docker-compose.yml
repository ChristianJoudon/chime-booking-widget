# Chime Standalone local Postgres for development.
#
# The schema and demo seed auto-apply on the FIRST boot only (Postgres runs
# /docker-entrypoint-initdb.d scripts when the data volume is empty).
# To wipe the database and reseed from scratch, run: docker compose down -v
#
# The project name is pinned rather than derived from the folder name, so this
# copy keeps its own container, volume, and network even if the directory is
# renamed or duplicated. It must never share Docker resources with another
# Chime checkout on this machine.
name: chime-standalone

services:
  db:
    image: postgres:16-alpine
    container_name: chime-standalone-db
    environment:
      POSTGRES_USER: chime
      POSTGRES_PASSWORD: chime
      POSTGRES_DB: chime
    ports:
      - "5534:5432" # host 5534: another local Postgres commonly owns 5432
    volumes:
      - chime-standalone-db-data:/var/lib/postgresql/data
      - ./database/postgres-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed-demo.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/migrations/001-platform-foundation.sql:/docker-entrypoint-initdb.d/03-platform-foundation.sql:ro
      - ./database/seed-admin-demo.sql:/docker-entrypoint-initdb.d/04-seed-admin-demo.sql:ro
      - ./database/seed-admin-test.sql:/docker-entrypoint-initdb.d/05-seed-admin-test.sql:ro
      - ./database/migrations/002-booking-payment-integrity.sql:/docker-entrypoint-initdb.d/06-booking-payment-integrity.sql:ro
      - ./database/migrations/003-team-member-versioning.sql:/docker-entrypoint-initdb.d/07-team-member-versioning.sql:ro
      - ./database/migrations/004-admin-availability-publication.sql:/docker-entrypoint-initdb.d/08-admin-availability-publication.sql:ro
      - ./database/migrations/005-operational-booking-workflow.sql:/docker-entrypoint-initdb.d/09-operational-booking-workflow.sql:ro
      - ./database/migrations/006-customer-change-approval.sql:/docker-entrypoint-initdb.d/10-customer-change-approval.sql:ro
      - ./database/migrations/007-notification-delivery.sql:/docker-entrypoint-initdb.d/11-notification-delivery.sql:ro
      - ./database/migrations/008-customer-crm.sql:/docker-entrypoint-initdb.d/12-customer-crm.sql:ro
      - ./database/migrations/009-payment-operations.sql:/docker-entrypoint-initdb.d/13-payment-operations.sql:ro
      - ./database/migrations/010-business-insights.sql:/docker-entrypoint-initdb.d/14-business-insights.sql:ro
      - ./database/migrations/011-business-settings.sql:/docker-entrypoint-initdb.d/15-business-settings.sql:ro
      - ./database/migrations/012-launch-and-embed.sql:/docker-entrypoint-initdb.d/16-launch-and-embed.sql:ro
      - ./database/migrations/013-rich-email-templates.sql:/docker-entrypoint-initdb.d/17-rich-email-templates.sql:ro
      - ./database/migrations/014-record-origin.sql:/docker-entrypoint-initdb.d/18-record-origin.sql:ro
      - ./database/migrations/015-administrator-credentials.sql:/docker-entrypoint-initdb.d/19-administrator-credentials.sql:ro
      - ./database/migrations/016-organization-provisioning.sql:/docker-entrypoint-initdb.d/20-organization-provisioning.sql:ro
      - ./database/migrations/017-customer-duplicates.sql:/docker-entrypoint-initdb.d/21-customer-duplicates.sql:ro
      - ./database/migrations/018-action-reasons.sql:/docker-entrypoint-initdb.d/22-action-reasons.sql:ro
      - ./database/seeds/001-demo-customers.sql:/docker-entrypoint-initdb.d/23-demo-customers.sql:ro
      - ./database/seeds/002-demo-schedule.sql:/docker-entrypoint-initdb.d/24-demo-schedule.sql:ro
      - ./database/seeds/003-demo-availability.sql:/docker-entrypoint-initdb.d/25-demo-availability.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chime -d chime"]
      interval: 5s
      retries: 10

volumes:
  chime-standalone-db-data:
